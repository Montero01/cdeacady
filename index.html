<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDE Academy | Casa dos Espelhos</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --cde-laranja: #E87722;
      --cde-laranja-escuro: #D4650F;
      --cde-vermelho: #C8102E;
      --gradiente-marca: linear-gradient(135deg, #E87722 0%, #C8102E 100%);
      --branco: #FFFFFF;
      --cinza-bg: #F8F7FB;
      --cinza-borda: #E9EAEE;
      --texto: #1F1F2E;
      --texto-soft: #6D6E71;
      --texto-mute: #9CA3AF;
      --roxo-escuro: #2E1065;
      --roxo-medio: #5B21B6;
      --roxo-claro: #7C3AED;
      --sidebar-w: 260px;
      --topbar-h: 68px;
      --sombra-sm: 0 1px 3px rgba(46,16,101,0.06);
      --sombra-md: 0 4px 14px rgba(46,16,101,0.08);
      --sombra-lg: 0 12px 32px rgba(46,16,101,0.14);
      --verde: #158A49;
      --verde-bg: #E6F7EE;
      --azul: #2563EB;
      --azul-bg: #E7EEFC;
      --amarelo: #B35A00;
      --amarelo-bg: #FFF4E5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--texto);
      background: var(--cinza-bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    .hidden { display: none !important; }

    /* ===================== LOADING SPLASH ===================== */
    #splash {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 0%, rgba(139,92,246,0.30) 0%, transparent 45%),
        radial-gradient(circle at 85% 100%, rgba(76,29,149,0.45) 0%, transparent 50%),
        linear-gradient(135deg, #2E1065 0%, #5B21B6 55%, #7C3AED 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: #fff;
      gap: 22px;
    }
    #splash img {
      max-width: 280px;
      width: 80%;
      height: auto;
      background: #fff;
      padding: 18px 22px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    #splash .spinner {
      width: 46px; height: 46px;
      border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #splash p {
      font-size: 0.9rem;
      opacity: 0.85;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* ===================== REDIRECT SCREEN ===================== */
    #redirect-view {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 0%, rgba(139,92,246,0.30) 0%, transparent 45%),
        radial-gradient(circle at 85% 100%, rgba(76,29,149,0.45) 0%, transparent 50%),
        linear-gradient(135deg, #2E1065 0%, #5B21B6 55%, #7C3AED 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      padding: 24px;
    }
    #redirect-view .redirect-card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
      border-top: 5px solid transparent;
      border-image: var(--gradiente-marca) 1;
      border-image-slice: 1;
    }
    #redirect-view .redirect-card .emoji { font-size: 3rem; margin-bottom: 12px; }
    #redirect-view .redirect-card h2 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: var(--texto);
      font-weight: 800;
    }
    #redirect-view .redirect-card p {
      font-size: 0.9rem;
      color: var(--texto-soft);
      margin-bottom: 26px;
      line-height: 1.6;
    }
    #redirect-view .redirect-card button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--gradiente-marca);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(200,16,46,0.28);
    }
    #redirect-view .redirect-card button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(200,16,46,0.35);
    }

    /* ===================== APP LAYOUT ===================== */
    #app-view {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--branco);
      border-right: 1px solid var(--cinza-borda);
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform 0.25s ease;
    }
    .sidebar-logo {
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-bottom: 1px solid var(--cinza-borda);
      flex-shrink: 0;
    }
    .sidebar-logo img {
      max-width: 100%;
      max-height: 42px;
      height: auto;
      width: auto;
      display: block;
    }
    .sidebar-user {
      padding: 22px 20px 18px;
      text-align: center;
      border-bottom: 1px solid var(--cinza-borda);
      flex-shrink: 0;
    }
    .sidebar-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      margin: 0 auto 12px;
      background: var(--gradiente-marca);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 16px rgba(200,16,46,0.25);
      border: 3px solid #fff;
      outline: 2px solid var(--cde-laranja);
    }
    .sidebar-user-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--texto);
      line-height: 1.3;
      margin-bottom: 3px;
    }
    .sidebar-user-role {
      font-size: 0.72rem;
      color: var(--texto-soft);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
    }
    .sidebar-user-sector {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--azul-bg);
      color: var(--azul);
    }
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 10px;
      color: var(--texto-soft);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      text-align: left;
      width: 100%;
      transition: background 0.15s, color 0.15s;
    }
    .nav-item:hover { background: #FFF4E5; color: var(--cde-laranja-escuro); }
    .nav-item.active {
      background: var(--gradiente-marca);
      color: #fff;
      box-shadow: 0 3px 10px rgba(200,16,46,0.25);
    }
    .nav-icon {
      font-size: 1.15rem;
      line-height: 1;
      width: 22px;
      text-align: center;
      flex-shrink: 0;
    }
    .sidebar-footer {
      padding: 12px 14px 16px;
      border-top: 1px solid var(--cinza-borda);
      flex-shrink: 0;
    }
    .logout-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--cinza-borda);
      background: transparent;
      color: var(--texto-soft);
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .logout-btn:hover {
      border-color: var(--cde-laranja);
      color: var(--cde-laranja-escuro);
      background: #FFF4E5;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 10, 40, 0.5);
      z-index: 99;
      backdrop-filter: blur(2px);
    }

    .main-wrapper {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .topbar {
      height: var(--topbar-h);
      background: var(--branco);
      border-bottom: 1px solid var(--cinza-borda);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .hamburger {
      display: none;
      background: transparent;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-size: 1.4rem;
      line-height: 1;
      color: var(--texto);
    }
    .hamburger:hover { background: var(--cinza-bg); }
    .topbar-search {
      position: relative;
      flex: 1;
      max-width: 460px;
    }
    .topbar-search input {
      width: 100%;
      padding: 10px 42px 10px 16px;
      border: 1.5px solid transparent;
      background: #F3F4F8;
      border-radius: 24px;
      font-size: 0.9rem;
      color: var(--texto);
      transition: border-color 0.2s, background 0.2s;
    }
    .topbar-search input::placeholder { color: var(--texto-mute); }
    .topbar-search input:focus {
      outline: none;
      background: #fff;
      border-color: var(--cde-laranja);
      box-shadow: 0 0 0 3px rgba(232,119,34,0.12);
    }
    .topbar-search::after {
      content: "🔍";
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      pointer-events: none;
      opacity: 0.5;
    }
    .topbar-spacer { flex: 1; }
    .topbar-points {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: linear-gradient(135deg, #FFF4E5, #FFE8CC);
      border-radius: 20px;
      font-weight: 800;
      color: var(--cde-laranja-escuro);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .topbar-points::before { content: "⭐"; font-size: 0.9rem; }
    .topbar-icons { display: flex; align-items: center; gap: 4px; }
    .icon-btn {
      background: transparent;
      border: none;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 1.05rem;
      line-height: 1;
      color: var(--texto-soft);
      transition: background 0.15s;
      position: relative;
    }
    .icon-btn:hover { background: var(--cinza-bg); color: var(--cde-laranja-escuro); }
    .icon-btn .badge-dot {
      position: absolute;
      top: 6px; right: 6px;
      width: 7px; height: 7px;
      background: var(--cde-vermelho);
      border-radius: 50%;
      border: 2px solid #fff;
    }
    .topbar-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--gradiente-marca);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      margin-left: 6px;
      box-shadow: 0 3px 8px rgba(200,16,46,0.25);
      border: 2px solid #fff;
    }

    .main-content {
      flex: 1;
      padding: 24px;
      max-width: 1400px;
      width: 100%;
    }

    .hero-banner {
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      min-height: 240px;
      background: linear-gradient(135deg, #4C1D95 0%, #7C3AED 55%, #A855F7 100%);
      display: flex;
      align-items: center;
      padding: 36px 40px;
      margin-bottom: 26px;
      box-shadow: var(--sombra-lg);
    }
    .hero-banner::before {
      content: "";
      position: absolute;
      top: -30%; right: -5%;
      width: 340px; height: 340px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .hero-banner::after {
      content: "";
      position: absolute;
      bottom: -40%; left: 30%;
      width: 240px; height: 240px;
      background: rgba(232,119,34,0.15);
      border-radius: 50%;
      filter: blur(20px);
    }
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 560px;
      color: #fff;
    }
    .hero-tag {
      display: inline-block;
      padding: 5px 12px;
      background: rgba(232,119,34,0.9);
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 14px;
      backdrop-filter: blur(4px);
    }
    .hero-content h1 {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 10px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .hero-content p {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-bottom: 18px;
      max-width: 460px;
    }
    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      background: #fff;
      color: var(--roxo-medio);
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.88rem;
      letter-spacing: 0.3px;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    }
    .hero-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.25); }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .section-header::before {
      content: "";
      width: 5px;
      height: 26px;
      background: var(--gradiente-marca);
      border-radius: 3px;
      flex-shrink: 0;
    }
    .section-header h2 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--texto);
      line-height: 1.2;
    }
    .section-header .section-sub {
      font-size: 0.85rem;
      color: var(--texto-soft);
      padding-left: 14px;
      border-left: 1px solid var(--cinza-borda);
      margin-left: 4px;
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .course-card {
      background: var(--branco);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--sombra-sm);
      border: 1px solid var(--cinza-borda);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .course-card:hover { transform: translateY(-4px); box-shadow: var(--sombra-lg); }
    .course-cover {
      height: 150px;
      background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 3rem;
      background-size: cover;
      background-position: center;
    }
    .course-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.35));
    }
    .course-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255,255,255,0.95);
      color: var(--texto);
    }
    .course-badge.novo      { background: #FFF4E5; color: var(--amarelo); }
    .course-badge.progresso { background: var(--azul-bg); color: var(--azul); }
    .course-badge.concluido { background: var(--verde-bg); color: var(--verde); }

    .course-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .course-body h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--texto);
      line-height: 1.35;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .course-body p {
      font-size: 0.82rem;
      color: var(--texto-soft);
      line-height: 1.5;
      flex: 1;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .course-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.72rem;
      color: var(--texto-soft);
      flex-wrap: wrap;
    }
    .course-meta .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: var(--cinza-bg);
      border-radius: 12px;
      font-weight: 600;
    }
    .course-progress {
      margin-top: 12px;
      height: 6px;
      background: var(--cinza-bg);
      border-radius: 3px;
      overflow: hidden;
    }
    .course-progress-fill {
      height: 100%;
      background: var(--gradiente-marca);
      border-radius: 3px;
      transition: width 0.4s;
    }

    .state-box {
      padding: 48px 24px;
      text-align: center;
      background: var(--branco);
      border-radius: 14px;
      border: 1px dashed var(--cinza-borda);
      color: var(--texto-soft);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .state-box .emoji { font-size: 2.6rem; display: block; margin-bottom: 12px; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 10, 50, 0.65);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
      backdrop-filter: blur(3px);
    }
    .modal-box {
      background: #fff;
      border-radius: 18px;
      max-width: 560px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      border-top: 5px solid transparent;
      border-image: var(--gradiente-marca) 1;
      border-image-slice: 1;
      animation: slideUp 0.2s ease;
      margin: auto;
    }
    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    .modal-box h3 { font-size: 1.2rem; margin-bottom: 8px; }
    .modal-box .subtitle { font-size: 0.85rem; color: var(--texto-soft); margin-bottom: 18px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .modal-actions button {
      padding: 10px 22px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      border: none;
      transition: transform 0.15s;
    }
    .modal-actions .primary { background: var(--gradiente-marca); color: #fff; box-shadow: 0 4px 12px rgba(200,16,46,0.28); }
    .modal-actions .primary:hover { transform: translateY(-1px); }
    .modal-actions .secondary { background: #F3F4F8; color: var(--texto); }
    .modal-actions .secondary:hover { background: #E5E7EB; }

    #message-box { position: fixed; top: 20px; right: 20px; z-index: 999; max-width: 360px; }
    .msg {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: var(--sombra-md);
      animation: slideIn 0.2s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(20px); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }
    .msg.success { background: var(--verde-bg); color: var(--verde); border-left: 4px solid var(--verde); }
    .msg.error   { background: #FDE8EB; color: var(--cde-vermelho); border-left: 4px solid var(--cde-vermelho); }

    .main-footer {
      padding: 24px;
      text-align: center;
      color: var(--texto-mute);
      font-size: 0.75rem;
      border-top: 1px solid var(--cinza-borda);
      margin-top: 24px;
    }
    .main-footer .footer-dev { font-weight: 700; color: var(--texto-soft); }
    .main-footer .footer-brand {
      font-weight: 800;
      background: var(--gradiente-marca);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media (max-width: 900px) {
      #app-view { grid-template-columns: 1fr; }
      .sidebar { transform: translateX(-100%); box-shadow: var(--sombra-lg); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .main-wrapper { grid-column: 1; }
      .hamburger { display: flex; }
      .topbar { padding: 0 16px; gap: 10px; }
      .topbar-search { max-width: 100%; }
      .topbar-points { padding: 6px 12px; font-size: 0.78rem; }
      .topbar-icons .icon-btn.hide-mobile { display: none; }
      .main-content { padding: 18px 16px; }
      .hero-banner { padding: 28px 24px; min-height: 200px; }
      .hero-content h1 { font-size: 1.5rem; }
      .hero-content p { font-size: 0.88rem; }
      .section-header .section-sub { display: none; }
      .courses-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
      .course-cover { height: 120px; font-size: 2.4rem; }
      .modal-box { padding: 22px; }
      .modal-actions { flex-direction: column-reverse; }

    }
    @media (max-width: 480px) {
      .topbar-search { display: none; }
      .hero-content h1 { font-size: 1.35rem; }
      .courses-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ===================== MENSAGENS ===================== -->
<div id="message-box"></div>

<!-- ===================== SPLASH (verificando sessão) ===================== -->
<div id="splash">
  <img src="https://casadosespelhos.com.br/wp-content/uploads/2018/05/marca_cde_cores_horizontal_tag_bl-2048x713.png"
       alt="CDE">

  <p>Verificando sua sessão…</p>
</div>

<!-- ===================== REDIRECT (sem sessão) ===================== -->
<div id="redirect-view" class="hidden">
  <div class="redirect-card">
    <div class="emoji">🔒</div>
    <h2>Sessão não encontrada</h2>
    <p>Para acessar a CDE Academy, faça login primeiro na plataforma <strong>PDI</strong>. Sua sessão será compartilhada automaticamente.</p>
    <button onclick="goToPDI()">Ir para o PDI →</button>

<!-- ===================== APP ===================== -->
<div id="app-view" class="hidden">

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">

    </div>

    <div class="sidebar-user">
      <div class="sidebar-avatar" id="user-avatar">CD</div>
      <div class="sidebar-user-name" id="user-name">Carregando…</div>
      <div class="sidebar-user-role" id="user-role"></div>
      <div class="sidebar-user-sector hidden" id="user-sector"></div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="home" onclick="switchView('home')">

      </button>
      <button class="nav-item" data-view="mycourses" onclick="switchView('mycourses')">
        <span class="nav-icon">💻</span><span>Meus Cursos</span>
      </button>
      <button class="nav-item" data-view="catalog" onclick="switchView('catalog')">
        <span class="nav-icon">📚</span><span>Catálogo de Cursos</span>
      </button>
      <button class="nav-item" data-view="path" onclick="switchView('path')">
        <span class="nav-icon">📈</span><span>Trilha de Conhecimento</span>
      </button>
      <button class="nav-item" data-view="agenda" onclick="switchView('agenda')">
        <span class="nav-icon">📅</span><span>Agenda</span>
      </button>
      <button class="nav-item" data-view="report" onclick="switchView('report')">
        <span class="nav-icon">📊</span><span>Relatório de Desenvolvimento</span>

      <button class="nav-item" data-view="forum" onclick="switchView('forum')">

      <button class="nav-item" data-view="certificates" onclick="switchView('certificates')">

    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">
        <span>🚪</span><span>Sair da conta</span>

  <div class="main-wrapper">
    <header class="topbar">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>

      </div>

      <div class="topbar-icons">

        <button class="icon-btn hide-mobile" title="Segurança">🛡️</button>
        <button class="icon-btn hide-mobile" title="Favoritos">⭐</button>
        <button class="icon-btn hide-mobile" title="Mensagens">✉️<span class="badge-dot"></span></button>
        <button class="icon-btn hide-mobile" title="Perfil">👤</button>

      <div class="topbar-avatar" id="topbar-avatar" onclick="switchView('report')" title="Ver meu relatório">CD</div>
    </header>

    <main class="main-content" id="main-content"></main>

    <footer class="main-footer">
      Sistema desenvolvido por <span class="footer-dev">Gabriel M.</span> para
      <span class="footer-brand">CDE Blindex AM</span> · v1.0
    </footer>
  </div>
</div>

<!-- ===================== MODAL CURSO ===================== -->
<div id="course-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="cm-title">—</h3>
    <p class="subtitle" id="cm-subtitle">—</p>
    <div id="cm-body"></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeCourseModal()">Fechar</button>
      <button class="primary" id="cm-action" onclick="startCourse()">Começar curso</button>
    </div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const SUPABASE_URL = 'https://whjyvphamkbjcrdzhzoc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_EyZgqDQTSV-M-O3_l63V7Q_LFcFDl69';
const PDI_URL = 'https://pdi.casadosespelhos.com.br';   // ⚠️ troque pela URL real do PDI

const { createClient } = supabase;
// ⚠️ Mesmo storageKey usado no PDI → compartilha sessão
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    storage: window.localStorage,
    storageKey: 'cde-auth-session',
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

// ==================== ESTADO ====================
let currentUser = null;
let currentProfile = null;
let currentView = 'home';
let allCourses = [];
let myEnrollments = [];
let completions = [];
let searchTerm = '';
let selectedCourse = null;

// ==================== HELPERS ====================
function showMessage(text, type = 'success') {
  const box = document.getElementById('message-box');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.textContent = text;
  box.appendChild(div);
  setTimeout(() => div.remove(), 4500);
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function initials(name) {
  if (!name) return 'CD';
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}
function roleLabel(role) {
  const r = (role || '').toLowerCase();
  if (r === 'supervisor') return 'Supervisor';
  if (r.includes('diretor') || r.includes('director') || r === 'diretoria') return 'Diretoria';
  if (r === 'master') return 'Master';
  return 'Colaborador';
}

// ==================== NAVEGAÇÃO ====================
function goToPDI() {
  window.location.href = PDI_URL;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
  window.scrollTo(0, 0);
  renderView(view);
}

function renderView(view) {
  const main = document.getElementById('main-content');
  switch (view) {
    case 'home':         main.innerHTML = renderHome(); break;
    case 'mycourses':    main.innerHTML = renderMyCourses(); break;
    case 'catalog':      main.innerHTML = renderCatalog(); break;
    case 'certificates': main.innerHTML = renderCertificates(); break;
    case 'report':       main.innerHTML = renderReport(); break;
    case 'path':         main.innerHTML = renderPlaceholder('📈', 'Trilha de Conhecimento', 'Em breve você poderá seguir trilhas de aprendizado personalizadas.'); break;
    case 'agenda':       main.innerHTML = renderPlaceholder('📅', 'Agenda', 'Em breve você poderá agendar treinamentos ao vivo e presenciais.'); break;
    case 'forum':        main.innerHTML = renderPlaceholder('💬', 'Fórum de Discussão', 'Em breve você poderá interagir com outros colaboradores da CDE.'); break;
    default:             main.innerHTML = renderHome();
  }
}

function onSearchInput() {
  searchTerm = (document.getElementById('global-search').value || '').toLowerCase().trim();
  if (currentView === 'home' || currentView === 'catalog' || currentView === 'mycourses') {
    renderView(currentView);
  }
}

// ==================== AUTH (AUTO-DETECÇÃO DE SESSÃO) ====================
async function boot() {
  // 1. Verifica se já existe sessão ativa (vinda do PDI)
  const { data: { session }, error } = await db.auth.getSession();

  if (error || !session) {
    // Sem sessão → mostra tela de redirect para o PDI
    document.getElementById('splash').classList.add('hidden');
    document.getElementById('redirect-view').classList.remove('hidden');

    // Bônus: após 5 segundos redireciona automaticamente para o PDI
    setTimeout(() => {
      window.location.href = PDI_URL;
    }, 5000);
    return;
  }

  // 2. Sessão válida → carrega o app
  currentUser = session.user;
  await loadUser();
}

async function loadUser() {
  const { data: profile, error } = await db
    .from('profiles').select('*').eq('id', currentUser.id).single();

  if (error || !profile) {
    showMessage('Perfil não encontrado. Redirecionando para o PDI…', 'error');
    setTimeout(() => { window.location.href = PDI_URL; }, 2500);
    return;
  }

  currentProfile = profile;

  // Esconde splash, mostra app
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('app-view').classList.remove('hidden');

  const name = profile.full_name || currentUser.email;
  const ini = initials(name);
  document.getElementById('user-avatar').textContent = ini;
  document.getElementById('topbar-avatar').textContent = ini;
  document.getElementById('user-name').textContent = name;
  document.getElementById('user-role').textContent = roleLabel(profile.role);

  const sectorEl = document.getElementById('user-sector');
  if (profile.sector) {
    sectorEl.textContent = profile.sector;
    sectorEl.classList.remove('hidden');
  }

  await loadTopbarPoints();
  await loadCourses();
  await loadMyEnrollments();
  await loadCompletions();

  renderView('home');
}

async function logout() {
  await db.auth.signOut();
  window.location.href = PDI_URL;
}

// ==================== DATA LOADING ====================
async function loadTopbarPoints() {
  try {
    const { data } = await db
      .from('certificates').select('points_awarded')
      .eq('user_id', currentUser.id).eq('status', 'approved');
    const total = (data || []).reduce((s, c) => s + (c.points_awarded || 0), 0);
    document.getElementById('topbar-points').textContent = `${total} pts`;
  } catch (e) {
    document.getElementById('topbar-points').textContent = '0 pts';
  }
}

async function loadCourses() {
  try {
    const { data, error } = await db.from('academy_courses').select('*')
      .eq('is_published', true).order('created_at', { ascending: false });
    if (error) throw error;
    allCourses = data || [];
  } catch (e) { allCourses = []; }
}

async function loadMyEnrollments() {
  try {
    const { data, error } = await db
      .from('academy_enrollments').select('*, academy_courses(*)')
      .eq('user_id', currentUser.id);
    if (error) throw error;
    const enrolls = data || [];
    myEnrollments = await Promise.all(enrolls.map(async (e) => {
      const course = e.academy_courses;
      if (!course) return null;
      const progress = await calcCourseProgress(currentUser.id, course.id);
      return { course, progress, status: e.status };
    }));
    myEnrollments = myEnrollments.filter(Boolean);
  } catch (e) { myEnrollments = []; }
}

async function loadCompletions() {
  try {
    const { data, error } = await db
      .from('academy_completions').select('*, academy_courses(title)')
      .eq('user_id', currentUser.id).order('completed_at', { ascending: false });
    if (error) throw error;
    completions = data || [];
  } catch (e) { completions = []; }
}

async function calcCourseProgress(userId, courseId) {
  try {
    const { data: mods } = await db.from('academy_modules').select('id').eq('course_id', courseId);
    const modIds = (mods || []).map(m => m.id);
    if (modIds.length === 0) return { done: 0, total: 0, pct: 0 };
    const { data: lessons } = await db.from('academy_lessons').select('id').in('module_id', modIds);
    const lessonIds = (lessons || []).map(l => l.id);
    const total = lessonIds.length;
    if (total === 0) return { done: 0, total: 0, pct: 0 };
    const { data: done } = await db.from('academy_progress')
      .select('lesson_id').eq('user_id', userId).in('lesson_id', lessonIds);
    const doneCount = (done || []).length;
    return { done: doneCount, total, pct: Math.round((doneCount / total) * 100) };
  } catch (e) { return { done: 0, total: 0, pct: 0 }; }
}

// ==================== RENDERIZAÇÃO ====================
function renderHome() {
  const enrolled = filterCourses(myEnrollments);
  const heroCourse = allCourses[0] || { title: 'Bem-vindo à CDE Academy', description: 'Explore os cursos disponíveis e desenvolva suas habilidades.' };

  return `
    <section class="hero-banner">
      <div class="hero-content">
        <span class="hero-tag">✨ Destaque</span>
        <h1>${escapeHtml(heroCourse.title || 'Bem-vindo à CDE Academy')}</h1>
        <p>${escapeHtml(heroCourse.description || 'Sua jornada de desenvolvimento profissional começa aqui. Explore os cursos liberados para você.')}</p>
        <button class="hero-btn" onclick="switchView('catalog')">Explorar cursos →</button>
      </div>
    </section>

    <div class="section-header">
      <h2>Cursos para você fazer</h2>
      <span class="section-sub">Treinamentos que foram liberados para você</span>
    </div>

    ${enrolled.length === 0 ? renderEmpty('📭', 'Nenhum curso liberado ainda. Aguarde seu supervisor atribuir um treinamento.') : `<div class="courses-grid">${enrolled.map(renderCourseCard).join('')}</div>`}

    ${allCourses.length > 0 && enrolled.length < allCourses.length ? `
      <div class="section-header">
        <h2>Catálogo completo</h2>
        <span class="section-sub">${allCourses.length} curso${allCourses.length === 1 ? '' : 's'} disponíve${allCourses.length === 1 ? 'l' : 'is'}</span>
      </div>
      <div class="courses-grid">
        ${allCourses.filter(c => !myEnrollments.some(e => e.course.id === c.id)).slice(0, 6).map(c => renderCatalogCard(c)).join('')}
      </div>
    ` : ''}
  `;
}

function renderMyCourses() {
  const enrolled = filterCourses(myEnrollments);
  if (enrolled.length === 0) {
    return `<div class="section-header"><h2>Meus Cursos</h2></div>${renderEmpty('📚', 'Você ainda não está matriculado em nenhum curso.')}`;
  }
  return `
    <div class="section-header">
      <h2>Meus Cursos</h2>
      <span class="section-sub">${enrolled.length} curso${enrolled.length === 1 ? '' : 's'}</span>
    </div>
    <div class="courses-grid">${enrolled.map(renderCourseCard).join('')}</div>
  `;
}

function renderCatalog() {
  let courses = allCourses;
  if (searchTerm) {
    courses = courses.filter(c =>
      (c.title || '').toLowerCase().includes(searchTerm) ||
      (c.description || '').toLowerCase().includes(searchTerm)
    );
  }
  if (courses.length === 0) {
    return `<div class="section-header"><h2>Catálogo de Cursos</h2></div>${renderEmpty('🔍', searchTerm ? 'Nenhum curso encontrado para sua busca.' : 'Nenhum curso publicado ainda.')}`;
  }
  return `
    <div class="section-header">
      <h2>Catálogo de Cursos</h2>
      <span class="section-sub">${courses.length} disponíve${courses.length === 1 ? 'l' : 'is'}</span>
    </div>
    <div class="courses-grid">${courses.map(c => renderCatalogCard(c)).join('')}</div>
  `;
}

function renderCertificates() {
  if (completions.length === 0) {
    return `<div class="section-header"><h2>Certificados e Declarações</h2></div>${renderEmpty('🎓', 'Você ainda não concluiu nenhum curso. Seus certificados aparecerão aqui.')}`;
  }
  return `
    <div class="section-header">
      <h2>Certificados e Declarações</h2>
      <span class="section-sub">${completions.length} conquistado${completions.length === 1 ? '' : 's'}</span>
    </div>
    <div class="courses-grid">
      ${completions.map(c => `
        <div class="course-card" style="cursor:default;">
          <div class="course-cover" style="background: linear-gradient(135deg, #158A49 0%, #0E6B39 100%);">
            🎓
            <span class="course-badge concluido">Concluído</span>
          </div>
          <div class="course-body">
            <h3>${escapeHtml(c.academy_courses?.title || 'Curso')}</h3>
            <p>Certificado de conclusão emitido em ${new Date(c.completed_at).toLocaleDateString('pt-BR')}.</p>
            <div class="course-meta">
              <span class="tag">🔑 ${escapeHtml(c.certificate_code || '—')}</span>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderReport() {
  const totalEnrolled = myEnrollments.length;
  const completed = myEnrollments.filter(e => e.progress.pct >= 100).length;
  const inProgress = myEnrollments.filter(e => e.progress.pct > 0 && e.progress.pct < 100).length;
  const completionRate = totalEnrolled > 0 ? Math.round((completed / totalEnrolled) * 100) : 0;

  const statCard = (label, value, color, emoji) => `
    <div style="background:#fff; border-radius:14px; padding:20px; border:1px solid var(--cinza-borda); box-shadow: var(--sombra-sm);">
      <div style="font-size: 1.8rem; margin-bottom: 8px;">${emoji}</div>
      <div style="font-size: 2rem; font-weight: 800; color: ${color}; line-height: 1;">${value}</div>
      <div style="font-size: 0.82rem; color: var(--texto-soft); margin-top: 6px;">${label}</div>
    </div>
  `;

  return `
    <div class="section-header">
      <h2>Relatório de Desenvolvimento</h2>
      <span class="section-sub">Sua evolução na CDE Academy</span>
    </div>

    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 26px;">
      ${statCard('Cursos matriculados', totalEnrolled, 'var(--roxo-medio)', '📚')}
      ${statCard('Concluídos', completed, 'var(--verde)', '✅')}
      ${statCard('Em andamento', inProgress, 'var(--cde-laranja)', '⏳')}
      ${statCard('Taxa de conclusão', completionRate + '%', 'var(--cde-vermelho)', '📈')}
    </div>

    <div style="background:#fff; border-radius:14px; padding:22px; border:1px solid var(--cinza-borda); box-shadow: var(--sombra-sm);">
      <h3 style="font-size: 1rem; margin-bottom: 14px;">📊 Progresso por curso</h3>
      ${totalEnrolled === 0 ? '<p style="color: var(--texto-soft); font-size:0.88rem;">Você ainda não está matriculado em nenhum curso.</p>' :
        myEnrollments.map(e => `
          <div style="padding: 12px 0; border-bottom: 1px solid var(--cinza-borda); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px;">
              <div style="font-weight: 700; font-size: 0.9rem;">${escapeHtml(e.course.title)}</div>
              <div style="font-size: 0.78rem; color: var(--texto-soft); margin-top: 3px;">
                ${e.progress.done} de ${e.progress.total} aulas concluídas
              </div>
            </div>
            <div style="font-weight: 800; color: ${e.progress.pct >= 100 ? 'var(--verde)' : 'var(--cde-laranja-escuro)'}; font-size: 0.95rem;">
              ${e.progress.pct}%
            </div>
          </div>
        `).join('')
      }
    </div>
  `;
}

function renderPlaceholder(emoji, title, description) {
  return `<div class="section-header"><h2>${title}</h2></div>${renderEmpty(emoji, description)}`;
}

function renderEmpty(emoji, message) {
  return `<div class="state-box"><span class="emoji">${emoji}</span>${escapeHtml(message)}</div>`;
}

function filterCourses(list) {
  if (!searchTerm) return list;
  return list.filter(e =>
    (e.course.title || '').toLowerCase().includes(searchTerm) ||
    (e.course.description || '').toLowerCase().includes(searchTerm)
  );
}

function renderCourseCard(enrollment) {
  const c = enrollment.course;
  const p = enrollment.progress;
  let badgeClass = 'novo', badgeText = 'Novo';
  if (p.pct >= 100) { badgeClass = 'concluido'; badgeText = 'Concluído'; }
  else if (p.pct > 0) { badgeClass = 'progresso'; badgeText = p.pct + '%'; }

  const coverStyle = c.cover_url ? `background-image: url('${escapeHtml(c.cover_url)}'); background-size: cover; background-position: center;` : '';
  const coverContent = c.cover_url ? '' : '📘';

  return `
    <div class="course-card" onclick="openCourseModal('${c.id}')">
      <div class="course-cover" style="${coverStyle}">
        <span class="course-badge ${badgeClass}">${badgeText}</span>
        ${coverContent}
      </div>
      <div class="course-body">
        <h3>${escapeHtml(c.title)}</h3>
        <p>${escapeHtml(c.description || 'Sem descrição.')}</p>
        <div class="course-meta">
          <span class="tag">⏱ ${c.workload_hours || 1}h</span>
          ${c.sector ? `<span class="tag">🏷 ${escapeHtml(c.sector)}</span>` : ''}
        </div>
        <div class="course-progress"><div class="course-progress-fill" style="width:${p.pct}%"></div></div>
      </div>
    </div>
  `;
}

function renderCatalogCard(course) {
  const coverStyle = course.cover_url ? `background-image: url('${escapeHtml(course.cover_url)}'); background-size: cover; background-position: center;` : '';
  const coverContent = course.cover_url ? '' : '📘';
  return `
    <div class="course-card" onclick="openCourseModal('${course.id}')">
      <div class="course-cover" style="${coverStyle}">
        <span class="course-badge">Catálogo</span>
        ${coverContent}
      </div>
      <div class="course-body">
        <h3>${escapeHtml(course.title)}</h3>
        <p>${escapeHtml(course.description || 'Sem descrição.')}</p>
        <div class="course-meta">
          <span class="tag">⏱ ${course.workload_hours || 1}h</span>
          ${course.sector ? `<span class="tag">🏷 ${escapeHtml(course.sector)}</span>` : ''}
        </div>
      </div>
    </div>
  `;
}

// ==================== MODAL CURSO ====================
async function openCourseModal(courseId) {
  let course = null;
  const enrollment = myEnrollments.find(e => e.course.id === courseId);
  if (enrollment) course = enrollment.course;
  else course = allCourses.find(c => c.id === courseId);
  if (!course) return showMessage('Curso não encontrado.', 'error');

  selectedCourse = { course, enrollment };
  document.getElementById('cm-title').textContent = course.title;
  document.getElementById('cm-subtitle').textContent =
    `${course.workload_hours || 1}h de carga horária${course.sector ? ' • ' + course.sector : ''}`;

  let modules = [];
  try {
    const { data: mods } = await db.from('academy_modules').select('*')
      .eq('course_id', course.id).order('order_index');
    modules = mods || [];
  } catch (e) { modules = []; }

  const body = document.getElementById('cm-body');
  if (modules.length === 0) {
    body.innerHTML = `
      <p style="color: var(--texto-soft); font-size: 0.9rem; margin-bottom: 12px;">
        ${escapeHtml(course.description || 'Este curso ainda não tem conteúdo publicado.')}
      </p>
      <p style="font-size: 0.82rem; color: var(--texto-mute);">📚 Conteúdo em preparação.</p>
    `;
  } else {
    body.innerHTML = `
      <p style="color: var(--texto-soft); font-size: 0.9rem; margin-bottom: 16px;">${escapeHtml(course.description || '')}</p>
      <div style="font-size: 0.8rem; font-weight: 700; color: var(--texto-soft); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;">Conteúdo do curso</div>
      ${modules.map((m, i) => `
        <div style="padding: 10px 12px; background: var(--cinza-bg); border-radius: 10px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center;">
          <span style="font-weight: 800; color: var(--cde-laranja);">M${i + 1}</span>
          <span style="font-weight: 600; font-size: 0.88rem;">${escapeHtml(m.title)}</span>
        </div>
      `).join('')}
    `;
  }

  const actionBtn = document.getElementById('cm-action');
  if (enrollment) {
    actionBtn.textContent = 'Continuar curso →';
    actionBtn.onclick = startCourse;
  } else {
    actionBtn.textContent = 'Ver detalhes →';
    actionBtn.onclick = () => showMessage('Em breve você poderá se inscrever diretamente. Peça ao seu supervisor!', 'success');
  }

  document.getElementById('course-modal').classList.remove('hidden');
}

function closeCourseModal() {
  document.getElementById('course-modal').classList.add('hidden');
  selectedCourse = null;
}

function startCourse() {
  closeCourseModal();
  showMessage('Player do curso chega na próxima versão! 🚀', 'success');
}

// ==================== INIT ====================
db.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') {
    window.location.href = PDI_URL;
  }
});

document.getElementById('course-modal')?.addEventListener('click', (e) => {
  if (e.target.id === 'course-modal') closeCourseModal();
});

boot();
</script>
